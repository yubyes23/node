name: Generate Files JSON

on:
  push:
    branches:
      - main  # 如果你的主分支叫 master，请改为 master
    paths:
      - 'json/**'
      - 'scripts/**'
      - 'spider/**'
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予工作流写入并推送代码的权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Paths JSON
        run: |
          # 1. 使用 find 查找三个目标文件夹下的所有文件 (排除目录本身)
          # 2. 使用 jq 将行文本列表转换成标准的 JSON 数组，并写入到根目录的 files.json
          find json scripts spider -type f 2>/dev/null | jq -R . | jq -s . > files.json
          
          echo "Generated JSON structure:"
          cat files.json

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add files.json
          
          # 检查是否有文件变化，如果有则提交并推送，防止无意义的报错
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动化更新资产路径索引 [skip ci]"
            git push
          else
            echo "没有路径发生变化，跳过提交。"
          fi
